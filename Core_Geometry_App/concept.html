<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script src="../shared/gate.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Functions — Concept Mastery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-depth: #0f172a;
            --bg-surface: #1e293b;
            --primary: #38bdf8;
            --accent: #818cf8;
            --success: #4ade80;
            --danger: #f87171;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --font-heading: 'Outfit', sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: var(--font-heading);
            background-color: var(--bg-depth);
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 70%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 16px 60px;
            line-height: 1.6;
        }
        .page {
            max-width: 920px;
            margin: 0 auto;
        }

        /* Top nav */
        .top-nav {
            display: flex;
            gap: 16px;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        .top-nav a {
            color: var(--text-muted);
            text-decoration: none;
        }
        .top-nav a:hover { color: var(--primary); }

        /* Header */
        header.intro {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px 32px;
            margin-bottom: 24px;
        }
        .icon-bubble {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            font-size: 1.6rem;
            margin-bottom: 12px;
        }
        header.intro h1 {
            font-size: 2rem;
            margin: 4px 0 6px 0;
            background: linear-gradient(to right, #fff, var(--text-muted));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        header.intro .lead {
            color: var(--text-muted);
            font-size: 1rem;
            margin: 12px 0 0;
            max-width: 760px;
        }

        /* Progress bar */
        .progress-wrap {
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 16px 24px;
            margin-bottom: 28px;
        }
        .progress-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .progress-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .progress-counts { font-weight: 600; }
        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success), var(--primary));
            width: 0%;
            transition: width 0.6s ease-out;
        }
        .reset-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font-heading);
            font-size: 0.8rem;
        }
        .reset-btn:hover { color: var(--text-main); border-color: var(--text-muted); }

        /* Archetype card */
        .arch-card {
            background: rgba(30, 41, 59, 0.55);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px 28px;
            margin-bottom: 16px;
            transition: border-color 0.3s ease;
        }
        .arch-card.understood {
            border-color: rgba(74, 222, 128, 0.4);
            background: rgba(74, 222, 128, 0.04);
        }
        .arch-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .arch-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
        }
        .arch-count {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            margin-top: 6px;
        }
        .arch-definition {
            color: var(--text-main);
            font-size: 0.97rem;
            margin: 8px 0 16px;
            opacity: 0.92;
        }
        .arch-section {
            margin-top: 16px;
        }
        .arch-section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 6px;
        }
        .cue-phrases {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .cue-tag {
            background: rgba(129, 140, 248, 0.12);
            border: 1px solid rgba(129, 140, 248, 0.3);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-family: 'Roboto Mono', monospace;
        }
        .must-do {
            list-style: none;
            padding-left: 0;
            margin: 0;
        }
        .must-do li {
            padding: 6px 0 6px 22px;
            position: relative;
            font-size: 0.95rem;
        }
        .must-do li::before {
            content: '→';
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: 700;
        }
        .trap-box {
            background: rgba(248, 113, 113, 0.08);
            border-left: 3px solid var(--danger);
            border-radius: 4px;
            padding: 12px 16px;
            font-size: 0.95rem;
        }
        .trap-name {
            font-weight: 600;
            color: var(--danger);
            margin-bottom: 4px;
        }
        .desmos-box {
            background: rgba(56, 189, 248, 0.06);
            border-left: 3px solid var(--primary);
            border-radius: 4px;
            padding: 12px 16px;
            font-size: 0.95rem;
        }
        .desmos-label {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .understood-row {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .understood-row .hint {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .mark-btn {
            padding: 8px 18px;
            border: 1px solid var(--success);
            background: transparent;
            color: var(--success);
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .mark-btn:hover {
            background: rgba(74, 222, 128, 0.1);
        }
        .mark-btn.is-understood {
            background: var(--success);
            color: #0f172a;
        }

        .closing-cta {
            background: rgba(30, 41, 59, 0.55);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 28px 32px;
            margin-top: 24px;
            text-align: center;
        }
        .closing-cta h2 {
            margin: 0 0 8px;
            font-size: 1.3rem;
        }
        .closing-cta p {
            color: var(--text-muted);
            margin: 0 0 20px;
        }
        .closing-cta a {
            display: inline-block;
            padding: 12px 28px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #0f172a;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
        }

        @media (max-width: 600px) {
            body { padding: 16px 12px 40px; }
            header.intro { padding: 22px 20px; }
            .arch-card { padding: 18px 20px; }
        }
    </style>
</head>

<body>
<div class="page">
    <div class="top-nav">
        <a href="../index.html">← Edutrack Hub</a>
        <span style="color:var(--border);">·</span>
        <a href="./index.html">Open the practice app →</a>
    </div>

    <header class="intro" id="header">
        <div class="icon-bubble" id="appIcon">📈</div>
        <h1 id="appName">Linear Functions — Concept Mastery</h1>
        <p class="lead" id="appIntro">Loading…</p>
    </header>

    <div class="progress-wrap">
        <div class="progress-row">
            <span class="progress-label">Archetypes understood</span>
            <span class="progress-counts">
                <span id="masteredCount">0</span> / <span id="totalCount">0</span>
                · <span id="pctCount">0</span>%
                <button id="resetBtn" class="reset-btn" title="Clear your "understood" marks for this domain">Reset marks</button>
            </span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div id="archCards"></div>

    <div class="closing-cta" id="closingCta" hidden>
        <h2>You've named all eight patterns. Now drill.</h2>
        <p>Open the practice app and try Smart Mode — it will surface your weakest questions first.</p>
        <a href="./index.html">Start practising →</a>
    </div>
</div>

<script src="../shared/progress.js"></script>
<script src="concept-data.js"></script>
<script>
(function () {
    const STORAGE_KEY_PREFIX = 'edutrack_concept_';
    const DATA = window.CONCEPT_DATA;
    if (!DATA) {
        document.body.innerHTML = '<p style="color:#f87171;padding:40px;">Concept data failed to load.</p>';
        return;
    }
    const storageKey = STORAGE_KEY_PREFIX + DATA.appId + '_v1';

    function loadFlags() {
        try {
            const raw = localStorage.getItem(storageKey);
            if (!raw) return {};
            const parsed = JSON.parse(raw);
            return (parsed && typeof parsed === 'object') ? parsed : {};
        } catch (e) {
            return {};
        }
    }
    function saveFlags(flags) {
        try { localStorage.setItem(storageKey, JSON.stringify(flags)); } catch (e) {}
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function renderHeader() {
        document.getElementById('appIcon').textContent = DATA.appIcon || '📘';
        document.getElementById('appName').textContent = `${DATA.appName} — Concept Mastery`;
        document.getElementById('appIntro').textContent = DATA.intro || '';
        document.title = `${DATA.appName} — Concept Mastery`;
    }

    function renderProgress(flags) {
        const total = DATA.archetypes.length;
        const mastered = DATA.archetypes.filter(a => flags[a.id] && flags[a.id].understood).length;
        document.getElementById('masteredCount').textContent = mastered;
        document.getElementById('totalCount').textContent = total;
        const pct = total > 0 ? Math.round((mastered / total) * 100) : 0;
        document.getElementById('pctCount').textContent = pct;
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('closingCta').hidden = (mastered !== total);
    }

    function renderCard(arch, flags) {
        const understood = !!(flags[arch.id] && flags[arch.id].understood);
        const cueHtml = (arch.cuePhrases || []).map(p => `<span class="cue-tag">${escapeHtml(p)}</span>`).join('');
        const mustHtml = (arch.mustDo || []).map(m => `<li>${escapeHtml(m)}</li>`).join('');
        return `
            <div class="arch-card${understood ? ' understood' : ''}" data-arch="${escapeHtml(arch.id)}">
                <div class="arch-header">
                    <h3 class="arch-title">${escapeHtml(arch.title)}</h3>
                    ${arch.count ? `<span class="arch-count">${arch.count} questions in your bank</span>` : ''}
                </div>
                <p class="arch-definition">${escapeHtml(arch.definition)}</p>

                <div class="arch-section">
                    <div class="arch-section-label">Cue phrases — if you see this, it's this archetype</div>
                    <div class="cue-phrases">${cueHtml}</div>
                </div>

                <div class="arch-section">
                    <div class="arch-section-label">What the correct answer must do</div>
                    <ul class="must-do">${mustHtml}</ul>
                </div>

                ${arch.commonTrap ? `
                <div class="arch-section">
                    <div class="arch-section-label">Common trap</div>
                    <div class="trap-box">
                        <div class="trap-name">${escapeHtml(arch.commonTrap.name)}</div>
                        <div>${escapeHtml(arch.commonTrap.disguise)}</div>
                    </div>
                </div>` : ''}

                ${arch.desmos ? `
                <div class="arch-section">
                    <div class="arch-section-label">Desmos play</div>
                    <div class="desmos-box">
                        <div class="desmos-label">In Desmos:</div>
                        <div>${escapeHtml(arch.desmos)}</div>
                    </div>
                </div>` : ''}

                <div class="understood-row">
                    <span class="hint">${understood ? 'Marked understood — keep it that way by drilling regularly.' : 'When you can name this pattern from the first line of a question, mark it understood.'}</span>
                    <button class="mark-btn${understood ? ' is-understood' : ''}" data-toggle="${escapeHtml(arch.id)}">
                        ${understood ? '✓ Understood' : 'Mark Understood'}
                    </button>
                </div>
            </div>
        `;
    }

    function attachToggle(container, flags) {
        container.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-toggle]');
            if (!btn) return;
            const archId = btn.getAttribute('data-toggle');
            const cur = flags[archId] && flags[archId].understood;
            if (cur) {
                delete flags[archId];
            } else {
                flags[archId] = { understood: true, markedAt: Date.now() };
            }
            saveFlags(flags);
            renderAll(flags);
        });
    }

    function renderAll(flags) {
        const container = document.getElementById('archCards');
        container.innerHTML = DATA.archetypes.map(a => renderCard(a, flags)).join('');
        renderProgress(flags);
    }

    function init() {
        renderHeader();
        const flags = loadFlags();
        renderAll(flags);
        attachToggle(document.getElementById('archCards'), flags);
        document.getElementById('resetBtn').addEventListener('click', () => {
            if (!confirm('Clear all "understood" marks for ' + DATA.appName + '?')) return;
            try { localStorage.removeItem(storageKey); } catch (e) {}
            renderAll({});
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
